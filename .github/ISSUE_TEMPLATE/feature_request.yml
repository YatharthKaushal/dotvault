name: Feature request
description: Suggest a feature or improvement for dotvault
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For larger features or architectural changes, open this issue **before**
        writing code so the implementation can be discussed first.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that dotvault makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to be able to type, and what should it do?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Local commands - finding, reading, editing env files
        - Vault - push, pull, versions
        - Sharing - links, codes, expiry, audit
        - Accounts - login, recovery, sessions
        - Server - API, hosting, storage
        - Security
        - Install / packaging / platforms
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools that solve this, and how.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to work on this
