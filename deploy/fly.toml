# Fly.io starting point. Not exercised by CI; see docs/deploy.md.
#
#   fly launch --no-deploy --copy-config --config deploy/fly.toml --dockerfile deploy/Dockerfile
#   fly volumes create dotvault_data --size 1
#   fly deploy --config deploy/fly.toml --dockerfile deploy/Dockerfile

app = "dotvault-change-me"
primary_region = "iad"

[env]
  DOTVAULT_DB = "/data/dotvault.db"
  DOTVAULT_BIND = "0.0.0.0:8080"
  DOTVAULT_TRUST_PROXY = "1"
  # DOTVAULT_PUBLIC_URL = "https://your-app.fly.dev"

[mounts]
  source = "dotvault_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # SQLite lives on one volume: exactly one machine, always running.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
